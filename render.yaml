# Render Blueprint: OpenClaw + AlphaClaw + GBrain (PGLite engine)
# Single-container deploy: AlphaClaw + OpenClaw + GBrain.

services:
  - type: web
    name: openclaw-gbrain
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      # --- AlphaClaw / OpenClaw core config ---
      - key: ALPHACLAW_ROOT_DIR
        value: /tmp
      - key: OPENCLAW_STATE_DIR
        value: /tmp/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /tmp/workspace
      - key: SETUP_PASSWORD
        generateValue: true
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: PORT
        value: "10000"

      # --- NVIDIA NIM configuration (replaces OpenAI) ---
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENCLAW_LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: OPENCLAW_LLM_MODEL
        value: openai/gpt-oss-20b

      # --- GBrain runtime config ---
      - key: GBRAIN_HOME
        value: /tmp

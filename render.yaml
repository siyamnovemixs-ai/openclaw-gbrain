# Render Blueprint: OpenClaw + AlphaClaw + GBrain (PGLite engine)
# Single-container deploy: AlphaClaw + OpenClaw + GBrain, with the GBrain
# knowledge brain stored as an embedded PGLite database on the persistent
# disk. No external Postgres required — PGLite runs in-process and ships
# pgvector + pg_trgm as bundled extensions.

services:
  - type: web
    name: openclaw-gbrain
    runtime: docker
    # Free plan: no persistent disk, state resets on each deploy.
    # Upgrade to Starter (1GB+ disk) for persistent storage.
    plan: free
    region: oregon
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    # ⛔ No disk block — free tier services cannot attach persistent disks.
    #    State directories point to /tmp (ephemeral) instead.
    envVars:
      # --- AlphaClaw / OpenClaw ---
      - key: ALPHACLAW_ROOT_DIR
        value: /tmp
      - key: OPENCLAW_STATE_DIR
        value: /tmp/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /tmp/workspace
      - key: SETUP_PASSWORD
        generateValue: true
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: PORT
        value: "10000"
      # --- GBrain API keys (required at deploy time) ---
      # OpenAI: embeddings (text-embedding-3-large)
      # Anthropic: multi-query expansion + LLM chunking (Haiku)
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # --- GBrain runtime config ---
      # GBRAIN_HOME is treated as a PARENT directory by gbrain — it
      # appends '.gbrain' itself. Setting GBRAIN_HOME=/tmp yields
      # configDir = /tmp/.gbrain (brain file at
      # /tmp/.gbrain/brain.pglite, config at /tmp/.gbrain/config.json).
      # NOTE: This is ephemeral on the free tier — data resets on redeploy.
      - key: GBRAIN_HOME
        value: /tmp
